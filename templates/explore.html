<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080b16">
  <link rel="icon" href="/static/icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css?v=2">
  <title>آخرین پست‌ها | دیدبان اینستاگرام</title>
  <style>
    .head{margin:2px 2px 16px}
    .head h1{font-size:20px;margin:0 0 4px;font-weight:800}
    .head p{margin:0;font-size:12px;color:var(--muted)}
    .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
    .tile{
      position:relative;display:block;aspect-ratio:1/1;overflow:hidden;
      border-radius:16px;border:1px solid var(--line);color:#fff;text-decoration:none;
      background:linear-gradient(140deg,#26304f,#141a30);
      transition:transform .2s;
    }
    .tile:active{transform:scale(.97)}
    .tile img.thumb{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
    .tile .ph{position:absolute;inset:0;display:grid;place-items:center;font-size:32px;font-weight:800;color:#8b95b3}
    .tile .shade{
      position:absolute;left:0;right:0;bottom:0;padding:22px 8px 7px;
      background:linear-gradient(transparent,rgba(0,0,0,.78));
      font-size:11px;font-weight:700;direction:ltr;text-align:left;
      overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    }
    .tile .badge{
      position:absolute;top:7px;right:7px;padding:2px 7px;border-radius:999px;font-size:10px;
      background:rgba(0,0,0,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    }
    .tile .dot{
      position:absolute;top:8px;left:8px;width:11px;height:11px;border-radius:50%;
      background:var(--red);box-shadow:0 0 0 3px rgba(255,77,109,.35);
    }
    .note{color:var(--muted);font-size:12px;line-height:1.9;margin:14px 2px}
    @media(min-width:560px){.grid{grid-template-columns:repeat(4,1fr);gap:8px}}
  </style>
</head>
<body data-swipe-left="/">
  <main class="shell">
    <header class="head">
      <h1>آخرین پست‌ها</h1>
      <p>تازه‌ترین پست هر پیج، به ترتیب زمان</p>
    </header>
    <section id="grid" class="grid" aria-live="polite"></section>
    <p id="note" class="note">در حال بارگذاری…</p>
  </main>

  <nav class="pager" aria-label="صفحه‌ها">
    <a href="/" aria-label="پیج‌ها"></a>
    <a class="on" href="/explore" aria-label="آخرین پست‌ها"></a>
  </nav>
  <script>
    const $ = (s) => document.querySelector(s);
    function esc(s) {
      return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
    }
    function typeLabel(t) {
      const x = String(t || "").toLowerCase();
      if (x === "video") return "ویدیو";
      if (x === "sidecar") return "آلبوم";
      return "";
    }
    function loadRead() {
      try { return JSON.parse(localStorage.getItem("didban_read_v1") || "{}") || {}; } catch { return {}; }
    }
    function ts(a) {
      const t = a.latest && a.latest.date_utc ? Date.parse(a.latest.date_utc) : NaN;
      return Number.isNaN(t) ? 0 : t;
    }
    async function load() {
      try {
        const r = await fetch("/api/status", {cache: "no-store"});
        if (!r.ok) throw new Error("status");
        const data = await r.json();
        if (window.Didban) Didban.merge(data);
        const readMap = loadRead();
        const withPost = data.accounts
          .filter(a => a.latest && a.latest.url)
          .sort((a, b) => String(b.latest.date_utc || "").localeCompare(String(a.latest.date_utc || "")));
        const missing = data.accounts.length - withPost.length;
        $("#grid").innerHTML = withPost.map(a => {
          const l = a.latest;
          const badge = typeLabel(l.typename);
          const isNew = readMap[a.username] !== undefined && ts(a) > readMap[a.username];
          const src = l.thumb_data || l.thumb_url;
          const thumb = src
            ? `<img class="thumb" src="${esc(src)}" alt="" loading="lazy" onerror="this.remove()">`
            : "";
          return `<a class="tile" href="${esc(l.url)}" target="_blank" rel="noopener noreferrer" title="${esc(l.caption || "")}">
            <div class="ph">${esc((a.username || "?").charAt(0).toUpperCase())}</div>
            ${thumb}
            ${isNew ? '<span class="dot"></span>' : ""}
            ${badge ? `<span class="badge">${badge}</span>` : ""}
            <div class="shade">@${esc(a.username)}</div>
          </a>`;
        }).join("");
        const parts = [];
        if (!withPost.length) parts.push("هنوز پستی ثبت نشده. بعد از اینکه پیج‌ها پست جدید بذارن اینجا نشون داده می‌شه.");
        if (missing > 0 && withPost.length) parts.push(missing + " پیج هنوز پست جدیدی نداشتن و اینجا نیستن.");
        $("#note").textContent = parts.join(" ");
      } catch (e) {
        $("#note").textContent = "به سرور وصل نشدیم.";
      }
    }
    load();
  </script>
  <script src="/static/cache.js?v=1"></script>
  <script src="/static/swipe.js?v=2"></script>
</body>
</html>
