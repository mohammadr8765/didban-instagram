<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080b16">
  <meta name="description" content="داشبورد اختصاصی بررسی پست‌های جدید پیج‌های اینستاگرام">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/static/icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css?v=2">
  <link rel="stylesheet" href="/static/cats.css?v=1">
  <title>دیدبان اینستاگرام</title>
</head>
<body data-swipe-right="/explore">
  <main class="shell">
    <header class="top">
      <div class="brand-mark">◉</div>
      <div class="brand-copy">
        <h1>دیدبان اینستاگرام</h1>
        <p>فهرست پیج‌ها و تشخیص محتوای جدید</p>
      </div>
      <button id="installBtn" class="ghost hidden" type="button">نصب برنامه</button>
    </header>

    <section class="summary">
      <div>
        <span class="eyebrow">فهرست اختصاصی تو</span>
        <h2><span id="accountCount">۸</span> پیج تحت نظر</h2>
        <p id="lastCheck">هنوز بررسی‌ای ثبت نشده</p>
        <p id="elapsed" style="margin-top:5px;color:var(--blue);font-size:12px;font-weight:700"></p>
      </div>
      <button id="checkBtn" class="primary" type="button">بررسی دوباره</button>
    </section>

    <div class="legend">
      <span class="legend-dot red"></span><span>محتوای جدید شناسایی شده</span>
      <span class="legend-dot muted"></span><span>مورد جدیدی ثبت نشده</span>
    </div>

    <nav id="cats" class="cats hidden" aria-label="دسته‌ها"></nav>

    <section id="accounts" class="account-list" aria-live="polite">
      <div class="loading">در حال بارگذاری فهرست…</div>
    </section>

    <footer>
      <p>بررسی خودکار ممکن است به‌دلیل محدودیت‌های اینستاگرام موقتاً ناموفق شود.</p>
      <p id="statusLine">اتصال به سرویس در حال بررسی است.</p>
    </footer>
  </main>

  <nav class="pager" aria-label="صفحه‌ها">
    <a class="on" href="/" aria-label="پیج‌ها"></a>
    <a href="/explore" aria-label="آخرین پست‌ها"></a>
  </nav>
  <div id="toast" class="toast" role="status"></div>
  <script src="/static/cache.js?v=1"></script>
  <script src="/static/app.js?v=4"></script>
  <script src="/static/swipe.js?v=2"></script>
</body>
</html>
